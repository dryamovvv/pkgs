name: opencode

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue-number:
        description: "Issue number for auto-fix"
        required: true
        type: number
      attempt:
        description: "Auto-fix attempt number (1-3)"
        required: true
        type: number
      run-url:
        description: "URL of the failed CI run"
        required: true
        type: string

jobs:
  opencode:
    if: |
      github.event_name != 'workflow_dispatch' &&
      !contains(github.event.issue.labels.*.name, 'ci-failure')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONTEXT7_API_KEY: ${{ secrets.CONTEXT7_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
        with:
          model: opencode/deepseek-v4-flash-free
          share: true
          use_github_token: true
          prompt: ${{ github.event.issue.body || github.event.comment.body }}

  auto-fix:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    concurrency:
      group: auto-fix-${{ inputs.issue-number }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run opencode auto-fix
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONTEXT7_API_KEY: ${{ secrets.CONTEXT7_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
        with:
          model: opencode/deepseek-v4-flash-free
          share: true
          use_github_token: true
          prompt: |
            The CI build for one or more packages has failed.

            Run URL: ${{ inputs.run-url }}
            Issue: ${{ github.server_url }}/${{ github.repository }}/issues/${{ inputs.issue-number }}
            Attempt: ${{ inputs.attempt }}/3

            Steps:
            1. Use `gh run view` with the failed run URL to read the failure logs
            2. Identify which package(s) failed and why
            3. Fix the PKGBUILD or related files in the packages/ directory
            4. Commit and push to main with message: fix(ci): auto-fix build failure (attempt ${{ inputs.attempt }})
            5. Comment on issue ${{ inputs.issue-number }} with a summary of what was fixed

            Important: Only fix the package that failed. Do not modify other packages or CI scripts.

      - name: Comment on issue after auto-fix
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            EMOJI="✅"
            MSG="Auto-fix attempt ${{ inputs.attempt }}/3 completed. Check the next build run for results."
          elif [ "${{ job.status }}" = "cancelled" ]; then
            EMOJI="⛔"
            MSG="Auto-fix attempt ${{ inputs.attempt }}/3 was cancelled."
          else
            EMOJI="❌"
            MSG="Auto-fix attempt ${{ inputs.attempt }}/3 failed. Manual intervention may be needed."
          fi
          gh issue comment ${{ inputs.issue-number }} --repo ${{ github.repository }} --body "${EMOJI} **${MSG}**" || true
          if [ "${{ job.status }}" = "success" ]; then
            gh issue close ${{ inputs.issue-number }} --repo ${{ github.repository }} --comment "Auto-fix applied and pushed. Closing — rebuild will verify." || true
          fi
