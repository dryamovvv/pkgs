name: Lint

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "packages/**"
      - "**.sh"
      - "**.md"
      - "**.install"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get changed files
        id: files
        run: |
          git diff --name-only origin/main...HEAD > /tmp/changed.txt
          echo "changed=$(cat /tmp/changed.txt | tr '\n' ' ')" >> $GITHUB_OUTPUT
          echo "Changed files:" && cat /tmp/changed.txt

      - name: ShellCheck (PKGBUILD, .sh, .install)
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: "./packages"
          format: tty
          severity: warning

      - name: Validate PKGBUILD syntax
        run: |
          for f in $(echo "${{ steps.files.outputs.changed }}" | tr ' ' '\n' | grep 'PKGBUILD$'); do
            [ -f "$f" ] || continue
            echo "::group::$f"
            bash -n "$f" && echo "  syntax OK" || echo "::error::SYNTAX ERROR in $f"
            echo "::endgroup::"
          done

      - name: Install namcap
        run: |
          docker pull lfdevs/archlinuxarm:base-devel

      - name: Run namcap on changed PKGBUILDs
        run: |
          for f in $(echo "${{ steps.files.outputs.changed }}" | tr ' ' '\n' | grep 'PKGBUILD$'); do
            [ -f "$f" ] || continue
            dir=$(dirname "$f")
            echo "::group::namcap $f"
            docker run --rm -v "$(pwd)/$dir:/workspace" lfdevs/archlinuxarm:base-devel \
              bash -c "cd /workspace && namcap PKGBUILD 2>&1" || true
            echo "::endgroup::"
          done

      - name: Validate sha256sums in PKGBUILDs
        run: |
          for f in $(echo "${{ steps.files.outputs.changed }}" | tr ' ' '\n' | grep 'PKGBUILD$'); do
            [ -f "$f" ] || continue
            echo "::group::sha256sums check $f"
            # Check that sha256sums array is not empty or SKIP
            if grep -q '^sha256sums=' "$f"; then
              sums_line=$(grep '^sha256sums=' "$f")
              if echo "$sums_line" | grep -qP 'SKIP|\(\s*\)'; then
                echo "::warning::sha256sums is SKIP or empty in $f"
              else
                echo "sha256sums present in $f"
              fi
            else
              echo "::error::Missing sha256sums in $f"
            fi
            echo "::endgroup::"
          done

      - name: Validate systemd service files
        run: |
          for f in $(echo "${{ steps.files.outputs.changed }}" | tr ' ' '\n' | grep -E '\.(service|socket|timer|target)$'); do
            [ -f "$f" ] || continue
            echo "::group::$f"
            # Check required sections
            if ! grep -q '^\[Unit\]' "$f"; then echo "::warning::Missing [Unit] section in $f"; fi
            if ! grep -q '^\[Service\]\|^\[Socket\]\|^\[Timer\]' "$f"; then echo "::warning::Missing main section in $f"; fi
            echo "::endgroup::"
          done

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install markdownlint-cli2
        run: npm install -g markdownlint-cli2

      - name: Fix markdown formatting
        run: |
          echo "Running markdown auto-fix..."
          markdownlint-cli2 --fix '**/*.md' 2>&1 || true

          # Convert hard tabs to spaces in TODO.md and similar
          find . -name "*.md" -type f ! -path "./.git/*" ! -path "./node_modules/*" \
            -exec sed -i 's/\t/    /g' {} \;

          # Show what was changed
          if git diff --quiet; then
            echo "No markdown changes needed"
          else
            echo "Markdown files were auto-fixed:"
            git diff --name-only
          fi

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: "**/*.md"
