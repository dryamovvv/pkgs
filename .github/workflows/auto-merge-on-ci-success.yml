name: auto-merge auto-fix PRs on CI success

on:
  workflow_run:
    workflows: ["Build and Deploy"]
    types: [completed]

permissions:
  contents: read
  pull-requests: write

jobs:
  merge-auto-fix:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Install gh
        run: gh --version || sudo apt-get update -y && sudo apt-get install -y gh jq

      - name: Find and merge auto-fix PR for commit
        env:
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          echo "Looking for PR with head SHA $HEAD_SHA"
          PR_NUM=$(gh pr list --state open --json number,headRefName,headRefOid --repo $REPO | jq -r '.[] | select(.headRefOid=="'${HEAD_SHA}'") | .number' | head -n1)
          if [ -z "$PR_NUM" ]; then
            echo "No PR found by headRefOid. Searching for open auto-fix PRs and matching head SHA"
            PR_NUM=$(gh pr list --state open --json number,headRefName,headRefOid --repo $REPO | jq -r '.[] | select(.headRefName|test("^auto-fix/")) | select(.headRefOid=="'${HEAD_SHA}'") | .number' | head -n1)
          fi
          if [ -z "$PR_NUM" ]; then
            echo "No matching auto-fix PR found for commit $HEAD_SHA. Exiting."
            exit 0
          fi
          echo "Found PR #$PR_NUM; attempting to merge"
          if gh pr merge $PR_NUM --repo $REPO --merge --subject "Auto-merge: auto-fix PR #$PR_NUM"; then
            echo "PR #$PR_NUM merged"
          else
            echo "Direct merge failed; attempting to approve then merge"
            gh pr review $PR_NUM --approve --repo $REPO || true
            gh pr merge $PR_NUM --repo $REPO --merge || echo "Merge still failed; manual intervention required"
          fi

      - name: Comment on PR result
        env:
          REPO: ${{ github.repository }}
          PR_NUM: $PR_NUM
        run: |
          echo "Done"
