name: Build and Deploy

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "ci/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: set-matrix
        run: echo "matrix=$(ci/detect-changes.sh)" >> $GITHUB_OUTPUT

  build:
    needs: detect
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        pkg: ${{ fromJson(needs.detect.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Build in container
        run: |
          docker rm -f builder 2>/dev/null || true
          docker run -d --name builder --privileged \
            lfdevs/archlinuxarm:base-devel sleep infinity
          docker cp . builder:/workspace/
          docker exec builder bash -c "cd /workspace && ci/build-package.sh ${{ matrix.pkg }}"
          docker cp builder:/workspace/packages ./
          docker rm -f builder
      - name: List packages
        run: find packages -name '*.pkg.tar.*' -type f -ls
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.pkg }}
          path: packages/${{ matrix.pkg }}/*.pkg.tar.*
          if-no-files-found: error

  deploy:
    needs: build
    if: success()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Prepare repository and generate index
        run: |
          docker rm -f repo-builder 2>/dev/null || true
          docker run -d --name repo-builder --privileged \
            lfdevs/archlinuxarm:base-devel sleep infinity
          docker cp artifacts repo-builder:/artifacts
          docker exec repo-builder bash -c '
            mkdir -p /repo/aarch64
            find /artifacts -name "*.pkg.tar.*" -exec cp {} /repo/aarch64/ \;
            cd /repo/aarch64
            PKGS=(*.pkg.tar.*)
            if [ ${#PKGS[@]} -gt 0 ] && [ -f "${PKGS[0]}" ]; then
              repo-add repo.db.tar.gz "${PKGS[@]}"
            fi
            cd /repo
            {
              echo "<!DOCTYPE html>"
              echo "<html lang=\"en\">"
              echo "<head><meta charset=\"UTF-8\"><title>aarch64 Repository</title></head>"
              echo "<body>"
              echo "<h1>Arch Linux aarch64 Package Repository</h1>"
              echo "<p>Optimized for Raspberry Pi 5 (Cortex-A76)</p><hr><pre>"
              for f in aarch64/*.pkg.tar.*; do
                [ -f "$f" ] && echo "<a href=\"$f\">$(basename $f)</a>"
              done
              echo "</pre></body></html>"
            } > index.html
          '
          docker cp repo-builder:/repo ./repo
          docker rm -f repo-builder
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: repo
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
