name: opencode

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      issue-number:
        description: "Issue number for auto-fix"
        required: true
        type: number
      attempt:
        description: "Auto-fix attempt number (1-3)"
        required: true
        type: number
      run-url:
        description: "URL of the failed CI run"
        required: true
        type: string

jobs:
  opencode-analysis:
    if: |
      github.event_name != 'workflow_dispatch' &&
      github.event_name != 'pull_request' &&
      !contains(github.event.issue.labels.*.name || '', 'ci-failure')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure git identity
        run: |
          git config user.name "opencode[bot]"
          git config user.email "opencode[bot]@users.noreply.github.com"

      - name: Clear checkout auth header (prevents duplicate with opencode)
        run: |
          git config --local --unset-all http.https://github.com/.extraheader 2>/dev/null || true

      - name: Configure git credentials for push
        run: |
          git config --global credential.helper store
          echo "https://x-access-token:${{ github.token }}@github.com" > ~/.git-credentials
          chmod 600 ~/.git-credentials

      - name: Install uv (for arch-mcp)
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Run opencode (new-package)
        if: |
          github.event_name == 'issues' &&
          contains(github.event.issue.labels.*.name, 'new-package')
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          CONTEXT7_API_KEY: ${{ secrets.CONTEXT7_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
        with:
          model: ${{ vars.OPEncode_MODEL || 'opencode/deepseek-v4-flash-free' }}
          share: true
          use_github_token: true
          prompt: |
            Add a new package. Issue: ${{ github.event.issue.title }}
            ${{ github.event.issue.body }}

            Steps (execute sequentially, do NOT ask questions):

            1. Extract package name from issue.
            2. Research: find upstream repo, latest release tag, build system.
               Use arch-mcp (search_aur, search_archwiki, get_official_package_info)
               to find existing PKGBUILDs as reference.
               Use Context7 for build system docs. Use web search for missing info.
            3. Create branch: add-package/{name}
            4. Write packages/{name}/PKGBUILD:
               - Enable ALL features, tests=disabled, debug=stripped, docs=enabled
               - RPi5 flags: CFLAGS="-mcpu=cortex-a76+crypto -O2 -pipe", LDFLAGS="-Wl,-z,max-page-size=0x4000"
               - Include sha256sums (download source, compute with sha256sum)
               - Follow Arch packaging conventions
            5. Write packages/{name}/README.md (description, build deps, features table)
            6. Write packages/{name}/AGENTS.md (version, build system, RPi5 flags)
            7. Add package to AGENTS.md and README.md tables (alphabetical)
            8. git add -A && git commit -m "feat: add {name} {version}"
            9. git push origin add-package/{name}
            10. gh pr create --base main --head add-package/{name} --title "feat: add {name} {version}" --body "New package. Features enabled: ..."
            11. Comment on issue: "PR: <link>. Enabled features: ... Reply 'disable X' to change."

            Speed over perfection. Skip wait for CI.

      - name: Run opencode (modify-package)
        if: |
          github.event_name == 'issues' &&
          contains(github.event.issue.labels.*.name, 'modify-package')
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          CONTEXT7_API_KEY: ${{ secrets.CONTEXT7_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
        with:
          model: ${{ vars.OPEncode_MODEL || 'opencode/deepseek-v4-flash-free' }}
          share: true
          use_github_token: true
          prompt: |
            A package modification request was opened:

            **Issue:** ${{ github.event.issue.title }}
            **Body:**
            ${{ github.event.issue.body }}

            ## Your task

            1. **Extract package name** from the issue title/body — must be an EXISTING package in `packages/`.
            2. **Read** the current `packages/{pkg-name}/PKGBUILD`, `AGENTS.md`, and `README.md`.
            3. **Understand the change request** from the issue body.
            4. **Research** if needed — e.g., if updating version, find latest upstream release, new dependencies, new features.
            5. **Create branch:** `modify-package/{pkg-name}` from main.
            6. **Apply changes:**
               - Update PKGBUILD (version, features, dependencies, flags)
               - Update AGENTS.md and README.md if features changed
               - Add/remove local files (services, configs, .install) as needed
               - Preserve RPi5 Cortex-A76 optimization flags
            7. **Do NOT change unrelated packages or CI scripts.**
            8. **Commit** with message: `fix({pkg-name}): <what changed>`
            9. **Push** the branch.
            10. **Open PR** against main with body summarizing the changes.
            11. **Comment on issue** with PR link.

            Do NOT wait for CI. The auto-merge workflow will merge after CI passes.

      - name: Run opencode (remove-package)
        if: |
          github.event_name == 'issues' &&
          contains(github.event.issue.labels.*.name, 'remove-package')
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          CONTEXT7_API_KEY: ${{ secrets.CONTEXT7_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
        with:
          model: ${{ vars.OPEncode_MODEL || 'opencode/deepseek-v4-flash-free' }}
          share: true
          use_github_token: true
          prompt: |
            A package removal request was opened:

            **Issue:** ${{ github.event.issue.title }}
            **Body:**
            ${{ github.event.issue.body }}

            ## Your task

            1. **Extract package name** from the issue title/body — must be an EXISTING package in `packages/`.
            2. **Create branch:** `remove-package/{pkg-name}` from main.
            3. **Remove** the entire `packages/{pkg-name}/` directory.
            4. **Remove** the package entry from `AGENTS.md` and `README.md` package tables.
            5. **Commit** with message: `chore: remove {pkg-name}`
            6. **Push** the branch.
            7. **Open PR** against main.
            8. **Comment on issue** with PR link.

            Do NOT wait for CI. The auto-merge workflow will merge after CI passes.

      - name: Run opencode (issue — generic/feature/bug)
        if: |
          github.event_name == 'issues' &&
          !contains(github.event.issue.labels.*.name || '', 'new-package') &&
          !contains(github.event.issue.labels.*.name || '', 'modify-package') &&
          !contains(github.event.issue.labels.*.name || '', 'remove-package') &&
          !contains(github.event.issue.labels.*.name || '', 'ci-failure')
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          CONTEXT7_API_KEY: ${{ secrets.CONTEXT7_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
        with:
          model: ${{ vars.OPEncode_MODEL || 'opencode/deepseek-v4-flash-free' }}
          share: true
          use_github_token: true
          prompt: |
            An issue was opened: ${{ github.event.issue.title }}

            ${{ github.event.issue.body }}

            ## Your task

            Read the issue, analyze what's being asked, and respond with a helpful comment.
            If it's a feature request or bug report — acknowledge, ask clarifying questions if needed.
            If you can implement the requested change — create a branch, make the changes, and open a PR.
            Comment on the issue with your response or questions.

      - name: Run opencode (issue comment — generic)
        if: |
          github.event_name == 'issue_comment' &&
          !contains(github.event.comment.body, 'opencode[bot]') &&
          !contains(github.event.issue.labels.*.name, 'new-package') &&
          !contains(github.event.issue.labels.*.name, 'ci-failure')
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          CONTEXT7_API_KEY: ${{ secrets.CONTEXT7_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
        with:
          model: ${{ vars.OPEncode_MODEL || 'opencode/deepseek-v4-flash-free' }}
          share: true
          use_github_token: true
          prompt: |
            A user commented on issue #${{ github.event.issue.number }}:

            **Issue title:** ${{ github.event.issue.title }}
            **Comment:**
            ${{ github.event.comment.body }}

            ## Your task

            1. Read the issue and all comments to understand the full conversation.
            2. Respond helpfully. If a feature/change is requested, implement it if possible.
            3. Comment on the issue with your response.

      - name: Run opencode (new-package comment)
        if: |
          github.event_name == 'issue_comment' &&
          !contains(github.event.comment.body, 'opencode[bot]') &&
          contains(github.event.issue.labels.*.name, 'new-package')
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          CONTEXT7_API_KEY: ${{ secrets.CONTEXT7_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
        with:
          model: ${{ vars.OPEncode_MODEL || 'opencode/deepseek-v4-flash-free' }}
          share: true
          use_github_token: true
          prompt: |
            A user commented on issue #${{ github.event.issue.number }}:

            **Issue title:** ${{ github.event.issue.title }}
            **Comment:**
            ${{ github.event.comment.body }}

            ## Your task

            1. Read the FULL issue history (previous comments) to understand context.
               Use `gh issue view ${{ github.event.issue.number }} --comments` to get all comments.
            2. If the comment requests changes to an existing package (e.g., "disable X feature", "change version"):
               - Find the existing branch `add-package/{pkg-name}` (or auto-fix branch)
               - Checkout the branch, make the changes, commit, push
               - Comment on the issue confirming what was changed
            3. If this is part of the new-package flow and all questions are answered:
               - Follow the add-package skill to create PKGBUILD and open a PR
             4. Comment on the issue with your response.

  opencode-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Auto-approve AI-generated PRs
        if: github.event.action == 'opened'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if echo "$BRANCH" | grep -qE '^(add-package|modify-package|remove-package|auto-fix|opencode/dispatch)/'; then
            echo "Auto-approving AI-generated PR: $BRANCH"
            gh pr review ${{ github.event.pull_request.number }} --approve \
              --body "LGTM. Automated approval — CI will verify the build." \
              --repo ${{ github.repository }}
          else
            echo "Human PR: review-only mode (no auto-approve)"
          fi

      - name: Run opencode PR review
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          CONTEXT7_API_KEY: ${{ secrets.CONTEXT7_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        with:
          model: ${{ vars.OPEncode_MODEL_REVIEW || vars.OPEncode_MODEL || 'opencode/deepseek-v4-flash-free' }}
          share: true
          use_github_token: true
          prompt: |
            A PR needs code review:

            **PR:** ${{ github.event.pull_request.html_url }}
            **Title:** ${{ github.event.pull_request.title }}
            **Branch:** ${{ github.event.pull_request.head.ref }}

            ## Your task

            1. Review the PR diff: `gh pr diff ${{ github.event.pull_request.number }}`
            2. Check for issues in the changed files and write your review findings.
            3. Only submit a review if you find actual problems:
               `gh pr review ${{ github.event.pull_request.number }} --request-changes -b "<issues>"`
            4. If the PR looks correct, do nothing — do not approve.
               Human reviewers handle approval for non-AI PRs.

  auto-fix-runner:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    concurrency:
      group: auto-fix-${{ inputs.issue-number }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure git identity
        run: |
          git config user.name "opencode[bot]"
          git config user.email "opencode[bot]@users.noreply.github.com"

      - name: Clear checkout auth header
        run: |
          git config --local --unset-all http.https://github.com/.extraheader 2>/dev/null || true

      - name: Configure git credentials for push
        run: |
          git config --global credential.helper store
          echo "https://x-access-token:${{ github.token }}@github.com" > ~/.git-credentials
          chmod 600 ~/.git-credentials

      - name: Run opencode auto-fix
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          CONTEXT7_API_KEY: ${{ secrets.CONTEXT7_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
        with:
          model: ${{ vars.OPEncode_MODEL_AUTOFIX || vars.OPEncode_MODEL || 'opencode/deepseek-v4-flash-free' }}
          share: true
          use_github_token: true
          prompt: |
            The CI build for one or more packages has failed.

            Run URL: ${{ inputs.run-url }}
            Issue: ${{ github.server_url }}/${{ github.repository }}/issues/${{ inputs.issue-number }}
            Attempt: ${{ inputs.attempt }}/3

            Steps:
            1. Use `gh run view` with the failed run URL to read the failure logs
            2. Identify which package(s) failed and why
            3. Fix the PKGBUILD or related files in the packages/ directory
            4. Commit locally (do not push) with message: fix(ci): auto-fix build failure (attempt ${{ inputs.attempt }})
            5. Output the git changes in the workspace for subsequent steps to create a branch and PR

            Important: Only fix the package that failed. Do not modify other packages or CI scripts.

      - name: Create auto-fix branch and PR
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          # Ensure we have full history
          git fetch --no-tags --prune --unshallow || true
          if [ -n "$(git status --porcelain)" ]; then
            ISSUE=${{ inputs.issue-number }}
            ATTEMPT=${{ inputs.attempt }}
            BRANCH="auto-fix/issue-${ISSUE}-attempt-${ATTEMPT}-$(date +%s)"
            git checkout -b "$BRANCH"
            git add -A
            git commit -m "fix(ci): auto-fix build failure (attempt ${ATTEMPT})" || true

            # Run lightweight makepkg checks inside container before pushing/creating PR
            REPO="${{ github.repository }}"
            CHANGED_PKGS=$(git show --name-only --pretty=format: HEAD | grep -oP 'packages/\K[^/]+' | sort -u || true)
            if [ -n "$CHANGED_PKGS" ]; then
              for pkg in $CHANGED_PKGS; do
                echo "== Checking package: $pkg =="
                if [ ! -f "packages/$pkg/PKGBUILD" ]; then
                  echo "No PKGBUILD for $pkg; skipping"
                  continue
                fi
                # Syntax check
                if ! bash -n "packages/$pkg/PKGBUILD"; then
                  gh issue comment ${ISSUE} --repo $REPO --body "❌ Auto-fix attempt ${ATTEMPT} produced a syntax error in packages/$pkg/PKGBUILD. Aborting PR creation." || true
                  exit 1
                fi
                # Basic required fields
                if ! grep -q '^pkgname=' "packages/$pkg/PKGBUILD" || ! grep -q '^pkgver=' "packages/$pkg/PKGBUILD"; then
                  gh issue comment ${ISSUE} --repo $REPO --body "❌ Auto-fix attempt ${ATTEMPT} produced an invalid PKGBUILD (missing pkgname/pkgver) in packages/$pkg. Aborting PR creation." || true
                  exit 1
                fi
              done
            else
              echo "No package files detected in commit; skipping PKGBUILD checks"
            fi

            git push origin "$BRANCH"

            PR_URL=$(gh pr create --title "Auto-fix: issue #${ISSUE} (attempt ${ATTEMPT})" \
              --body "Auto-fix attempt ${ATTEMPT} for issue #${ISSUE}. See workflow run: ${{ inputs.run-url }}\n\nAuto-fix branch: ${BRANCH}\n\nNote: issue will be closed only after PR is merged and CI passes." \
              --base main --head "$BRANCH" --repo ${{ github.repository }} --json url -q '.url') || true

            gh issue comment ${ISSUE} --repo ${{ github.repository }} --body "🔧 Auto-fix attempt ${ATTEMPT} created a PR: ${PR_URL}. It will be merged after verification; the issue will be closed only after merge and successful CI." || true
          else
            echo "No changes produced by auto-fix; nothing to create."
          fi

      - name: Comment on issue after auto-fix
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            EMOJI="✅"
            MSG="Auto-fix attempt ${{ inputs.attempt }}/3 created (or no-op). A PR was opened for review. The issue will be closed after PR merge and successful CI."
          elif [ "${{ job.status }}" = "cancelled" ]; then
            EMOJI="⛔"
            MSG="Auto-fix attempt ${{ inputs.attempt }}/3 was cancelled."
          else
            EMOJI="❌"
            MSG="Auto-fix attempt ${{ inputs.attempt }}/3 failed. Manual intervention may be needed."
          fi
          gh issue comment ${{ inputs.issue-number }} --repo ${{ github.repository }} --body "${EMOJI} **${MSG}**" || true
