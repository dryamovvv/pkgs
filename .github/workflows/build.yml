name: Build and Deploy

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "ci/**"
      - ".github/workflows/**"
  workflow_dispatch:
    inputs:
      debug_enabled:
        type: boolean
        description: "Enable tmate SSH debugging (connect to CI container)"
        required: false
        default: false
      force_pkg:
        type: string
        description: "Force running a specific package (for testing)"
        required: false
        default: ""
      force_rebuild_all:
        type: boolean
        description: "Force rebuild all packages ignoring cache"
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect-changed-packages:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - id: set-matrix
        env:
          FORCE_PKG: ${{ github.event.inputs.force_pkg }}
          FORCE_REBUILD_ALL: ${{ github.event.inputs.force_rebuild_all }}
        run: |
          if [ "${FORCE_REBUILD_ALL:-false}" = "true" ]; then
            ALL=$(ls -d packages/*/ 2>/dev/null | sed 's|packages/||;s|/||')
            if [ -z "$ALL" ]; then
              echo "matrix=[]" >> $GITHUB_OUTPUT
            else
              echo "matrix=$(echo "$ALL" | jq -R -s -c 'split("\n") | map(select(. != ""))')" >> $GITHUB_OUTPUT
            fi
          elif [ -n "${FORCE_PKG:-}" ]; then
            echo "matrix=[\"${FORCE_PKG}\"]" >> $GITHUB_OUTPUT
          else
            echo "matrix=$(ci/detect-changes.sh)" >> $GITHUB_OUTPUT
          fi

  build-packages-matrix:
    needs: detect-changed-packages
    if: ${{ needs.detect-changed-packages.outputs.matrix != '[]' && needs.detect-changed-packages.outputs.matrix != '' }}
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        pkg: ${{ fromJSON(needs.detect-changed-packages.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compute build input hash
        id: compute-hash
        env:
          FORCE_REBUILD_ALL: ${{ github.event.inputs.force_rebuild_all }}
        run: |
          chmod +x ci/run-compute-hash.sh ci/compute-build-hash.sh
          ./ci/run-compute-hash.sh packages/${{ matrix.pkg }}
          echo "Computed outputs: build_hash=${{ steps.compute-hash.outputs.build_hash }} build_hash_sanitized=${{ steps.compute-hash.outputs.build_hash_sanitized }}"

      - name: Restore built package cache
        id: built-cache
        uses: actions/cache@v5
        with:
          path: /tmp/build-cache/${{ matrix.pkg }}
          key: build-artifact-${{ matrix.pkg }}-${{ steps.compute-hash.outputs.build_hash_sanitized }}

      - name: Show build cache info
        run: |
          echo "build_cache_key=build-artifact-${{ matrix.pkg }}-${{ steps.compute-hash.outputs.build_hash }}"
          echo "built_cache_hit=${{ steps.built-cache.outputs.cache-hit }}"

      - name: Use cached build artifact
        if: steps.built-cache.outputs.cache-hit == 'true'
        run: |
          mkdir -p packages-built/${{ matrix.pkg }}
          cp -r /tmp/build-cache/${{ matrix.pkg }}/* packages-built/${{ matrix.pkg }}/ || true

      # ── Docker image cache ──
      - name: Cache Docker image
        id: docker-cache
        uses: actions/cache@v5
        with:
          path: /tmp/docker-image.tar
          key: docker-archlinuxarm-v2-${{ hashFiles('.github/workflows/build.yml') }}

      - name: Show docker cache info
        run: |
          echo "docker_cache_key=docker-archlinuxarm-v2-${{ hashFiles('.github/workflows/build.yml') }}"
          echo "docker_cache_hit=${{ steps.docker-cache.outputs.cache-hit }}"

      - name: Pull Docker image
        if: steps.docker-cache.outputs.cache-hit != 'true'
        run: |
          docker pull lfdevs/archlinuxarm:base-devel
          docker save lfdevs/archlinuxarm:base-devel -o /tmp/docker-image.tar

      - name: Load cached Docker image
        if: steps.docker-cache.outputs.cache-hit == 'true'
        run: docker load -i /tmp/docker-image.tar

      # ── Pacman package cache ──
      - name: Cache pacman packages
        uses: actions/cache@v5
        with:
          path: /tmp/pacman-cache
          key: pacman-cache-v2-${{ hashFiles('packages/*/PKGBUILD') }}
          restore-keys: pacman-cache-v2-

      # ── ccache ──
      - name: Cache ccache
        id: ccache-cache
        uses: actions/cache@v5
        with:
          path: /tmp/ccache
          key: ccache-v2-${{ matrix.pkg }}-${{ steps.compute-hash.outputs.build_hash_sanitized }}
          restore-keys: ccache-v2-${{ matrix.pkg }}-

      - name: Show ccache info
        run: |
          echo "ccache_key=ccache-v2-${{ matrix.pkg }}-${{ hashFiles(format('packages/{0}/PKGBUILD', matrix.pkg)) }}"
          echo "ccache_hit=${{ steps.ccache-cache.outputs.cache-hit }}"

      # ── Cargo cache (Rust) ──
      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            /tmp/cargo-registry
            /tmp/cargo-git
          key: cargo-v2-${{ matrix.pkg }}-${{ steps.compute-hash.outputs.build_hash_sanitized }}
          restore-keys: cargo-v2-${{ matrix.pkg }}-

      # ── Build ──
      - name: Build in container
        if: steps.built-cache.outputs.cache-hit != 'true'
        timeout-minutes: 90
        run: |
          mkdir -p /tmp/pacman-cache /tmp/ccache /tmp/cargo-registry /tmp/cargo-git
          docker rm -f builder 2>/dev/null || true
          docker run -d --name builder \
            -v /tmp/pacman-cache:/var/cache/pacman/pkg \
            -v /tmp/ccache:/ccache \
            -v /tmp/cargo-registry:/home/builder/.cargo/registry \
            -v /tmp/cargo-git:/home/builder/.cargo/git \
            -v $GITHUB_WORKSPACE/packages/${{ matrix.pkg }}:/workspace/packages/${{ matrix.pkg }} \
            -v $GITHUB_WORKSPACE/ci:/workspace/ci:ro \
            lfdevs/archlinuxarm:base-devel sleep infinity
          # Mount only the package directory and ci scripts into the container to avoid copying the whole repo
          # Ensure updpkgsums is available inside the container to allow automated checksum updates
          docker exec builder pacman -Sy --noconfirm updpkgsums || true
          docker exec \
            -e GPG_KEY="${{ vars.GPG_KEY_ID }}" \
            -e GPG_IMPORT="${{ secrets.GPG_PRIVATE_KEY }}" \
            -e GPG_PASSPHRASE="${{ secrets.GPG_PASSPHRASE }}" \
            builder bash -c "cd /workspace && ci/build-package.sh ${{ matrix.pkg }}"

      - name: Fix cargo cache permissions
        if: always()
        run: |
          sudo chown -R $(id -u):$(id -g) /tmp/cargo-registry /tmp/cargo-git 2>/dev/null || true

      - name: List packages (from cache)
        if: steps.built-cache.outputs.cache-hit == 'true'
        run: |
          find packages-built -name '*.pkg.tar.*' -type f -ls

      - name: List packages (from build)
        if: steps.built-cache.outputs.cache-hit != 'true'
        run: |
          docker cp builder:/workspace/packages ./packages-built
          find packages-built -name '*.pkg.tar.*' -type f -ls

      - name: Populate build cache
        if: steps.built-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/build-cache/${{ matrix.pkg }}
          cp -r packages-built/${{ matrix.pkg }}/* /tmp/build-cache/${{ matrix.pkg }}/ || true

      # ── Debug via SSH (only on manual trigger with debug_enabled=true) ──
      - name: Setup tmate session
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_enabled }}
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true
          timeout-minutes: 30

      # ── Deploy removed from per-package matrix job ──
      # Deploy now runs once for all built artifacts in the separate 'deploy-packages' job.

      # ── Artifact backup ──
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.pkg }}
          path: packages-built/${{ matrix.pkg }}/*.pkg.tar.*
          if-no-files-found: error

      # ── Cleanup ──
      - name: Stop container
        if: always()
        run: docker rm -f builder 2>/dev/null || true

  deploy-packages:
    needs: build-packages-matrix
    runs-on: ubuntu-24.04-arm
    if: needs.build-packages-matrix.result == 'success'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: packages-built

      - name: Install GitHub CLI
        run: |
          set -eux
          if command -v gh >/dev/null 2>&1; then
            echo "gh already installed"
          else
            # Install official GitHub CLI on ubuntu-latest
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg >/dev/null 2>&1 || true
            sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg || true
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
            sudo apt update -y
            sudo apt install -y gh || true
          fi

      - name: Validate SSH and GPG secrets
        run: |
          : "${SSH_HOST:?ERROR: SSH_HOST secret not set}"
          : "${SSH_PORT:?ERROR: SSH_PORT secret not set}"
          : "${SSH_USER:?ERROR: SSH_USER secret not set}"
          : "${SSH_PRIVATE_KEY:?ERROR: SSH_PRIVATE_KEY secret not set}"
          : "${SSH_REPO_PATH:?ERROR: SSH_REPO_PATH secret not set}"
          : "${GPG_PASSPHRASE:?ERROR: GPG_PASSPHRASE secret not set}"
          echo "All deploy secrets are configured"
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_REPO_PATH: ${{ secrets.SSH_REPO_PATH }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_IMPORT: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_KEY: ${{ vars.GPG_KEY_ID }}

      - name: Prepare SSH key and known_hosts
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > /tmp/ssh-deploy-key
          chmod 600 /tmp/ssh-deploy-key
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Start deploy container
        run: |
          docker pull lfdevs/archlinuxarm:base-devel
          docker rm -f deployer 2>/dev/null || true
          docker run -d --name deployer \
            -e SSH_HOST='${{ secrets.SSH_HOST }}' \
            -e SSH_PORT='${{ secrets.SSH_PORT }}' \
            -e SSH_USER='${{ secrets.SSH_USER }}' \
            -e REPO_PATH='${{ secrets.SSH_REPO_PATH }}' \
            -e GPG_PASSPHRASE='${{ secrets.GPG_PASSPHRASE }}' \
            -e GPG_IMPORT='${{ secrets.GPG_PRIVATE_KEY }}' \
            -e GPG_KEY='${{ vars.GPG_KEY_ID }}' \
            -v $GITHUB_WORKSPACE/packages-built:/workspace/packages \
            -v $GITHUB_WORKSPACE/ci:/workspace/ci:ro \
            lfdevs/archlinuxarm:base-devel sleep infinity
          docker cp /tmp/ssh-deploy-key deployer:/tmp/ssh_key || true
          docker exec deployer mkdir -p /root/.ssh || true
          docker cp ~/.ssh/known_hosts deployer:/root/.ssh/known_hosts || true

      - name: Deploy all packages
        run: |
          docker exec deployer bash -lc "cd /workspace && for p in packages/*; do if [ -d \"$p\" ]; then echo Deploying $p; ci/deploy-package.sh \"$p\" || true; fi; done"

      - name: Stop deploy container
        if: always()
        run: docker rm -f deployer 2>/dev/null || true

  create-failure-issue:
    needs: [detect-changed-packages, build-packages-matrix]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
      actions: write
    steps:
      - uses: actions/checkout@v6

      - name: Create or update failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x ci/report-failure.sh
          ci/report-failure.sh \
            "${{ github.repository }}" \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "${{ github.sha }}" \
            "${{ github.run_id }}" \
            '${{ needs.detect-changed-packages.outputs.matrix }}'
